<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>杭州主城区游玩锻炼路线规划</title>
  <link rel="stylesheet" href="static/style.css">
  <script type="text/javascript">
    (function () {
      var code = '';
      try { code = localStorage.getItem('amap_js_security_code') || ''; } catch (e) {}
      if (code) {
        window._AMapSecurityConfig = { securityJsCode: code };
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1>杭州主城区游玩锻炼路线规划</h1>
      <p class="subtitle">登录 lbs.amap.com 注册配置高德 JS API Key 与安全密钥</p>
    </header>

    <div class="alert alert-error" id="form-error" style="display:none;"></div>

    <form class="card" id="plan-form">
      <details class="advanced" id="advanced-config">
        <summary>高级配置</summary>
        <div class="advanced-body">
          <div class="field">
            <span>高德 JS API Key</span>
            <input type="password" id="amap_js_api_key" placeholder="必填，用于地理编码与步行/驾车路径" autocomplete="off">
            <span>高德安全密钥（securityJsCode）</span>
            <input type="password" id="amap_js_security_code" placeholder="必填，高德 JS API 2.0 安全密钥" autocomplete="off">
            <div class="key-actions">
              <label><input type="checkbox" id="save_keys"> 保存到本机（Key + 安全密钥）</label>
              <button type="button" id="keys_clear" class="btn btn-ghost">清除</button>
            </div>
            <p class="hint" id="keys_hint" style="display:none;">已保存到本机（localStorage），下次打开自动填充</p>
          </div>
        </div>
      </details>

      <div class="field">
        <span>出发地址</span>
        <div class="cascade-box">
          <div class="selected-address empty" id="origin_display">未选择（请通过下方下拉选择小区）</div>
          <div class="cascade-row">
            <select id="origin_district" class="cascade">
              <option value="">请选择主城区</option>
            </select>
            <select id="origin_street" class="cascade" disabled>
              <option value="">请选择街道</option>
            </select>
            <select id="origin_community" class="cascade" disabled>
              <option value="">请选择小区</option>
            </select>
          </div>
        </div>
        <div class="manual-address">
          <span class="manual-title">手动输入自定义地址（选填，与下拉互斥）</span>
          <input type="text" id="origin_manual" placeholder="例如：杭州市西湖区中杭府" autocomplete="off">
        </div>
      </div>

      <div class="field">
        <span>返回地址</span>
        <div class="cascade-box">
          <div class="selected-address empty" id="destination_display">未选择（请通过下方下拉选择小区）</div>
          <div class="cascade-row">
            <select id="destination_district" class="cascade">
              <option value="">请选择主城区</option>
            </select>
            <select id="destination_street" class="cascade" disabled>
              <option value="">请选择街道</option>
            </select>
            <select id="destination_community" class="cascade" disabled>
              <option value="">请选择小区</option>
            </select>
          </div>
        </div>
        <div class="manual-address">
          <span class="manual-title">手动输入自定义地址（选填，与下拉互斥）</span>
          <input type="text" id="destination_manual" placeholder="可与出发地址相同" autocomplete="off">
        </div>
      </div>

      <fieldset class="field">
        <legend>🥾 是否爬山</legend>
        <div class="radio-row">
          <label><input type="radio" name="hiking" value="是" checked> 是</label>
          <label><input type="radio" name="hiking" value="否"> 否</label>
        </div>
      </fieldset>

      <div class="field">
        <span>🏔️ 必去景点</span>
        <div class="must-visit-add">
          <input type="text" id="must-visit-input" placeholder="输入景点名，如：龙井村" autocomplete="off">
          <button type="button" class="btn btn-ghost" id="must-visit-add">添加</button>
        </div>
        <div class="chips" id="must-visit-chips"></div>
        <p class="hint">可留空，最多添加 6 个景点</p>
        <p class="field-error" id="must-visit-error" style="display:none;">最多添加 6 个景点</p>
      </div>

      <div class="field">
        <span>🎯 游玩景点数量</span>
        <div class="count-row">
          <input type="number" id="count" min="1" max="6" value="3" inputmode="numeric">
          <span class="count-unit">1-6 个</span>
        </div>
        <p class="field-error" id="count-error" style="display:none;">游玩景点数量必须在 1-6 之间</p>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">生成路线</button>
    </form>
  </div>

  <script src="js/trip-engine.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
